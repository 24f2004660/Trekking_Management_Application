{% extends "base.html" %}
{% set current_user = 'Admin' %}
{% block content %}

<div class="row">

    <!-- Sidebar -->
    {% set current_page = 'treks' %}
    {% include "Admin_templates/components/admin_menu.html" %}

    <!-- Main Content -->
    <div class="col-md-10">

        <h3 class="mb-4">Edit Trek</h3>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">

                <form method="POST" action="/update_trek">

                    <div class="row">

                        <!-- Left Column -->
                        <div class="col-md-6">

                            <div class="mb-3">
                                <label class="form-label">Trek ID</label>
                                <input type="text" class="form-control" name="t_id" value="{{trek_data.trek_id}}" readonly>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" name="start_date" value="{{trek_data.start_date}}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" name="location" value="{{trek_data.location}}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Difficulty</label>
                                <select class="form-select" name="difficulty" required>
                                    <option disabled>Select Difficulty</option>
                                    <option value="E" {% if trek_data.diff == 'E' %}selected{% endif %}>Easy</option>
                                    <option value="M" {% if trek_data.diff == 'M' %}selected{% endif %}>Moderate</option>
                                    <option value="H" {% if trek_data.diff == 'H' %}selected{% endif %}>Hard</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Duration (Days)</label>
                                <input type="number" class="form-control" name="duration" value="{{trek_data.duration}}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Total Slots</label>
                                    <input type="number" class="form-control" name="total_slots" value="{{trek_data.total_slots}}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Available Slots</label>
                                    <input type="number" class="form-control" name="avl_slots" value="{{trek_data.avl_slots}}" required>
                                </div>
                            </div>

                        </div>

                        <!-- Right Column -->
                        <div class="col-md-6">

                            <div class="mb-3">
                                <label class="form-label">Trek Name</label>
                                <input type="text" class="form-control" name="trek_name" value="{{trek_data.t_name}}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" name="end_date" value="{{trek_data.end_date}}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Assign Staff</label>
                                <select class="form-select" name="asn_staff" required>
                                    <option disabled>Select Staff</option>
                                    {% for staff in staffs %}
                                    {% if staff.status == 1 %}
                                        <option value="{{ staff.staff_id }}" {% if trek_data.assign_s_id == staff.staff_id %}selected{% endif %}>
                                            {{ staff.name }}
                                        </option>
                                    {% endif %}
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" name="status">
                                    <option disabled>Select Status</option>
                                    <option value="1" {% if trek_data.status == '1' %}selected{% endif %}>Open</option>
                                    <option value="0" {% if trek_data.status == '0' %}selected{% endif %}>Closed</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" rows="5" name="description" >{{trek_data.description}}</textarea>
                            </div>

                        </div>

                    </div>

                    <div class="text-end mt-3">
                        <input type="reset" class="btn btn-secondary" value="Reset">
                        <a href="{{ url_for('admin_manage_treks') }}" class="btn btn-danger">Cancel</a>
                        <input type="submit" class="btn btn-primary" value="Update Trek">
                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
