<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking Management Application</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        .dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            Trekking Management Application
        </a>

        <div class="dropdown">
            <a href="#" class="text-dark text-decoration-none dropdown-toggle"
                data-bs-toggle="dropdown">
                <i class="bi bi-person-circle"></i> {{ current_user }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end" >
                <li>
                    <a class="dropdown-item text-danger" href="{{ url_for('login') }}">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    {% block content %}
    
    {% endblock %}
</div>
<!-- Footer -->
<footer class="border-top mt-5 py-3">
    <div class="container-fluid">
        <center>
            <span class="bg-red text-muted">
                &copy; 2026 Trekking Management Application. All rights reserved.
            </span>

            <span class="text-muted">
                Developed by 24f2004660
            </span>
        </center>
    </div>
</footer>
</body>
</html>
